{% extends 'base.html' %}{% from 'macros.html' import csrf,heading %}{% block content %}
{{heading(('Editar item' if item.id else 'Adicionar item')~' · '~tipo.nome,'A ordem determina a sequência no checklist; itens inativos não entram em novas manutenções.')}}
<form method="post" class="panel">{{csrf()}}<div class="row g-3"><div class="col-md-6"><label class="form-label" for="componente">Nome do componente</label><input id="componente" name="componente" value="{{item.componente or ''}}" required maxlength="180" class="form-control"></div><div class="col-md-6"><label class="form-label" for="categoria_id">Categoria</label><select name="categoria_id" id="categoria_id" required class="form-select">{% for c in categorias %}<option value="{{c.id}}" {{'selected' if item.categoria_id==c.id}}>{{c.nome}}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label" for="descricao">Descrição</label><textarea id="descricao" name="descricao" class="form-control" rows="3">{{item.descricao or ''}}</textarea></div><div class="col-md-4"><label class="form-label" for="ordem">Ordem de exibição</label><input type="number" id="ordem" name="ordem" value="{{item.ordem if item.ordem is not none else (tipo.modelo_checklist.itens|length + 1)}}" min="0" step="1" required class="form-control"></div><div class="col-md-4"><label class="form-label" for="obrigatorio">Obrigatório</label><select id="obrigatorio" name="obrigatorio" class="form-select"><option value="0" {{'selected' if not item.obrigatorio}}>Não</option><option value="1" {{'selected' if item.obrigatorio}}>Sim</option></select></div><div class="col-md-4"><label class="form-label" for="ativo">Ativo</label><select id="ativo" name="ativo" class="form-select"><option value="1" {{'selected' if item.ativo or not item.id}}>Sim</option><option value="0" {{'selected' if item.id and not item.ativo}}>Não</option></select></div></div><div class="mt-4 d-flex gap-2"><button class="btn btn-primary">Salvar item</button><a href="{{url_for('checklist_models.listing',tipo=tipo.id)}}" class="btn btn-light">Voltar</a></div></form>{% endblock %}
